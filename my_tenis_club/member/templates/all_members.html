<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Members</title>
</head>
<body>
    <h1>Members</h1>

    <ol>
        {% for x in mymembers %}

        {% endfor %}
    </ol>
</body>
</html>
